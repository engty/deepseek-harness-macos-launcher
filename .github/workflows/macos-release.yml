name: macOS build

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: '22.18.0'
  HARNESS_VERSION: '0.1.0-rc.6'

jobs:
  source-build:
    name: Swift build
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build Swift package
        run: swift build

  build-macos:
    name: Build macOS arm64 App
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: source-build
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Assemble pinned Harness Runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime_source="$RUNNER_TEMP/harness-runtime"
          mkdir -p "$runtime_source"
          npm install --prefix "$runtime_source" --ignore-scripts --no-audit --no-fund "@deepseek-ai/dsh@${HARNESS_VERSION}"
          HARNESS_RUNTIME_SOURCE="$runtime_source" \
            HARNESS_NODE_PATH="$(command -v node)" \
            ./script/package_runtime.sh
      - name: Build and validate App bundle
        env:
          APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.1.0-dev' }}
        run: ./script/build_and_run.sh --build-only
      - name: Package downloadable archive
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/deepseek-harness-release"
          release_app="$release_dir/DeepSeek Harness.app"
          disk_image="$RUNNER_TEMP/DeepSeek-Harness-macos-arm64.dmg"
          rm -rf "$release_dir" "$release_app" "$disk_image"
          mkdir -p "$release_dir"
          ditto dist/HarnessLauncher.app "$release_app"
          hdiutil create \
            -volname "DeepSeek Harness" \
            -srcfolder "$release_dir" \
            -ov \
            -format UDZO \
            "$disk_image"
          (
            cd "$RUNNER_TEMP"
            shasum -a 256 \
              "DeepSeek-Harness-macos-arm64.dmg" > "SHA256SUMS.txt"
          )
          cat "$RUNNER_TEMP/SHA256SUMS.txt"
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Harness-macos-arm64
          path: |
            ${{ runner.temp }}/DeepSeek-Harness-macos-arm64.dmg
            ${{ runner.temp }}/SHA256SUMS.txt
      - name: Publish GitHub Release for version tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "$RUNNER_TEMP/DeepSeek-Harness-macos-arm64.dmg" \
              "$RUNNER_TEMP/SHA256SUMS.txt" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "DeepSeek Harness $GITHUB_REF_NAME" \
              --generate-notes \
              "$RUNNER_TEMP/DeepSeek-Harness-macos-arm64.dmg" \
              "$RUNNER_TEMP/SHA256SUMS.txt"
          fi
