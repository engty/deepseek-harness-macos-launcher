name: macOS build

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22.19.0'
  PNPM_VERSION: '10.19.0'
  # Pin the Runtime used by this release to the latest verified official npm
  # prerelease. The App can still discover newer prereleases at runtime.
  HARNESS_VERSION: '0.1.1-rc.2'

jobs:
  source-build:
    name: Swift build
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build Swift package
        run: swift build

  test:
    name: Swift test (macOS 15 / Swift 6)
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Run Swift test suite
        run: swift test

  build-macos:
    name: Build macOS arm64 App
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: [source-build, test]
    runs-on: macos-14
    # Write access is required only for the tag release upload, never for
    # pull_request or plain push builds.
    permissions:
      contents: write
    env:
      # The version lives in every distributed filename so a downloaded DMG
      # can always be identified without opening it.
      APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.1.0-dev' }}
      DMG_NAME: DeepSeek-Harness-${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.1.0-dev' }}-macos-arm64.dmg
      # npm may resolve a large Harness dependency graph; the default Node.js
      # heap on GitHub's runner is too small for this installation.
      NODE_OPTIONS: --max-old-space-size=4096
      MNEMON_VERSION: '0.2.5'
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Assemble pinned Harness Runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime_source="$RUNNER_TEMP/harness-runtime"
          pnpm_bootstrap="$RUNNER_TEMP/pnpm-bootstrap"
          mkdir -p "$runtime_source" "$pnpm_bootstrap"
          # Bootstrap pnpm in a separate prefix. Installing pnpm and Harness
          # into the same prefix makes pnpm move its own package aside during
          # reification, which aborts the install on the hosted runner.
          npm install --prefix "$pnpm_bootstrap" --ignore-scripts --no-audit --no-fund \
            "pnpm@${PNPM_VERSION}"
          "$pnpm_bootstrap/node_modules/.bin/pnpm" \
            --dir "$runtime_source" \
            add \
            --ignore-scripts \
            --lockfile=false \
            "@deepseek-ai/dsh@${HARNESS_VERSION}"
          mkdir -p "$runtime_source/node_modules/.bin"
          ditto "$pnpm_bootstrap/node_modules/pnpm" "$runtime_source/node_modules/pnpm"
          ln -sf ../pnpm/bin/pnpm.cjs "$runtime_source/node_modules/.bin/pnpm"
          chmod +x "$runtime_source/node_modules/pnpm/bin/pnpm.cjs"
          HARNESS_MNEMON_VERSION="${MNEMON_VERSION}" \
            ./script/fetch_mnemon_cli.sh "$runtime_source/bin"
          HARNESS_RUNTIME_SOURCE="$runtime_source" \
            HARNESS_NODE_PATH="$(command -v node)" \
            ./script/package_runtime.sh
      - name: Build and validate App bundle
        run: ./script/build_and_run.sh --build-only
      - name: Package downloadable DMG
        shell: bash
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/deepseek-harness-release"
          release_app="$release_dir/DeepSeek Harness.app"
          applications_link="$release_dir/Applications"
          disk_image="$RUNNER_TEMP/$DMG_NAME"
          rm -rf "$release_dir" "$release_app" "$applications_link" "$disk_image"
          mkdir -p "$release_dir"
          ditto dist/HarnessLauncher.app "$release_app"
          # Standard macOS drag-to-install layout: the App and an
          # Applications shortcut are visible together in the mounted window.
          ln -s /Applications "$applications_link"
          hdiutil create \
            -volname "DeepSeek Harness" \
            -srcfolder "$release_dir" \
            -ov \
            -format UDZO \
            "$disk_image"
          (
            cd "$RUNNER_TEMP"
            shasum -a 256 \
              "$DMG_NAME" > "SHA256SUMS.txt"
          )
          # Verify the DMG itself and that the checksum manifest matches the
          # exact file that will be uploaded.
          hdiutil verify "$disk_image"
          (cd "$RUNNER_TEMP" && shasum -a 256 -c SHA256SUMS.txt)
          cat "$RUNNER_TEMP/SHA256SUMS.txt"
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Harness-macos-arm64
          path: |
            ${{ runner.temp }}/${{ env.DMG_NAME }}
            ${{ runner.temp }}/SHA256SUMS.txt
      - name: Publish GitHub Release for version tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "$RUNNER_TEMP/$DMG_NAME" \
              "$RUNNER_TEMP/SHA256SUMS.txt" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "DeepSeek Harness $GITHUB_REF_NAME" \
              --generate-notes \
              "$RUNNER_TEMP/$DMG_NAME" \
              "$RUNNER_TEMP/SHA256SUMS.txt"
          fi
